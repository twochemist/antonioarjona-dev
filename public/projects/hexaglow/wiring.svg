<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 235" role="img" aria-labelledby="title desc">
  <title id="title">HexaGlow signal flow</title>
  <desc id="desc">The INMP441 microphone and ESP32 exchange I²S signals. LED data goes from GPIO 18 through a 5 V level shifter to the LED strip. All modules share ground.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f7bf81"/>
    </marker>
  </defs>
  <rect width="800" height="235" rx="18" fill="#1b2028"/>
  <g fill="#292f3a" stroke="#707a8d" stroke-width="2">
    <rect x="25" y="67" width="161" height="99" rx="12"/>
    <rect x="268" y="67" width="146" height="99" rx="12"/>
    <rect x="493" y="67" width="130" height="99" rx="12"/>
    <rect x="675" y="67" width="100" height="99" rx="12"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#f9f4ea">
    <text x="28" y="37" text-anchor="start" font-size="22" font-weight="700">Proposed signal flow</text>
    <g font-size="19" font-weight="700">
      <text x="105" y="110">INMP441</text>
      <text x="341" y="110">ESP32</text>
      <text x="558" y="110">Level shifter</text>
      <text x="725" y="110">RGB strip</text>
    </g>
    <g font-size="15" fill="#ccd2dc">
      <text x="105" y="136">I²S microphone</text>
      <text x="341" y="136">WLED controller</text>
      <text x="558" y="136">3.3 V → 5 V</text>
      <text x="725" y="136">5 V</text>
      <text x="226" y="92">I²S</text>
      <text x="453" y="100">GPIO 18</text>
      <text x="649" y="100">DIN</text>
      <text x="400" y="206">Controller, microphone, shifter and strip share ground.</text>
    </g>
  </g>
  <g fill="none" stroke="#f7bf81" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M264 111H191"/>
    <path d="M190 132H263"/>
    <path d="M418 119H488"/>
    <path d="M627 119H670"/>
  </g>
</svg>
